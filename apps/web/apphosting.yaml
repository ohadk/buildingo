# Firebase App Hosting configuration for the Buildingo API + web console.
# Secrets live in Cloud Secret Manager (firebase apphosting:secrets:set).
runConfig:
  minInstances: 0
  maxInstances: 4

env:
  # ── Firebase client config (inlined into the bundle at build time) ──
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDlCxUQLNbD3V-ZXfme1YQ5g5cbW5sC4-E
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: buildingo-6ff54.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: buildingo-6ff54
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:848466124816:web:00f734d593d6821065aa95
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "848466124816"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: buildingo-6ff54.firebasestorage.app
    availability: [BUILD, RUNTIME]

  # ── Server-side config ───────────────────────────────────────────
  - variable: SUPABASE_URL
    value: https://wcybxiwnewryvazqpxzg.supabase.co
    availability: [RUNTIME]
  - variable: SENDGRID_FROM_EMAIL
    value: dispatch@dira.app
    availability: [RUNTIME]

  # ── Secrets (Cloud Secret Manager) ───────────────────────────────
  - variable: SUPABASE_SECRET_KEY
    secret: SUPABASE_SECRET_KEY
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
